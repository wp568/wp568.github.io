<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>管理员 - 手动充值</title>
<style>
  body { font-family: Arial, sans-serif; max-width: 500px; margin: 50px auto; text-align: center; }
  input { padding: 10px; width: 80%; margin: 10px 0; font-size: 16px; }
  button { padding: 10px 20px; font-size: 16px; background: #28a745; color: white; border: none; border-radius: 5px; cursor: pointer; }
  #result { margin-top: 20px; font-size: 18px; }
</style>
</head>
<body>
<h1>管理员后台 - 手动给用户加积分</h1>
<input type="text" id="target-username" placeholder="输入用户名（如：user123）">
<input type="number" id="add-points" placeholder="输入要加的积分（如：50）">
<button onclick="adminAddPoints()">提交充值</button>
<div id="result"></div>

<script>
async function adminAddPoints() {
  const username = document.getElementById('target-username').value.trim();
  const points = parseInt(document.getElementById('add-points').value);
  if (!username || isNaN(points) || points <= 0) {
    document.getElementById('result').innerText = '请输入有效的用户名和积分';
    document.getElementById('result').style.color = 'red';
    return;
  }

  try {
    const res = await fetch('/api/admin/add-points', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, points })
    });
    const data = await res.json();
    if (data.ok) {
      document.getElementById('result').innerText = `成功！用户 ${username} 当前积分：${data.newPoints}`;
      document.getElementById('result').style.color = 'green';
    } else {
      document.getElementById('result').innerText = `失败：${data.msg}`;
      document.getElementById('result').style.color = 'red';
    }
  } catch (e) {
    document.getElementById('result').innerText = '网络错误，请重试';
    document.getElementById('result').style.color = 'red';
  }
}
</script>
</body>
</html>
