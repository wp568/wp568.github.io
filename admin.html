<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>管理后台</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-6">
<div class="max-w-5xl mx-auto bg-white rounded-xl p-6 shadow-lg">
  <h2 class="text-2xl font-bold mb-6">网站数据统计 & 手动加积分</h2>
  <div class="grid grid-cols-2 md:grid-cols-5 gap-4 mb-8">
    <div class="border p-4 text-center rounded-lg"><p class="text-gray-500">总用户数</p><p id="userCount" class="text-xl font-bold">0</p></div>
    <div class="border p-4 text-center rounded-lg"><p class="text-gray-500">总生成次数</p><p id="totalGen" class="text-xl font-bold">0</p></div>
    <div class="border p-4 text-center rounded-lg"><p class="text-gray-500">成功次数</p><p id="succGen" class="text-xl font-bold text-green-600">0</p></div>
    <div class="border p-4 text-center rounded-lg"><p class="text-gray-500">失败次数</p><p id="failGen" class="text-xl font-bold text-red-600">0</p></div>
    <div class="border p-4 text-center rounded-lg"><p class="text-gray-500">成功率</p><p id="rate" class="text-xl font-bold">0%</p></div>
  </div>

  <hr class="my-6">
  <h3 class="text-xl font-bold mb-4">手动给用户充值加积分</h3>
  <div class="max-w-md mx-auto">
    <input id="addUser" placeholder="输入用户名" class="w-full border rounded-lg p-3 mb-3">
    <input id="addNum" type="number" placeholder="输入增加积分数量" class="w-full border rounded-lg p-3 mb-3">
    <button onclick="addScore()" class="w-full bg-green-600 text-white p-3 rounded-lg">确认添加</button>
    <p id="msg" class="mt-3 text-center"></p>
  </div>

  <a href="index.html" class="inline-block mt-6 text-green-600">← 返回首页</a>
</div>
<script>
const API_BASE = "https://wp568-github-io.onrender.com";
let user;
try{
  user = JSON.parse(localStorage.getItem('aiUser'));
}catch(e){
  alert('请先登录'); location.href='login.html';
}
if(!user || !user.isAdmin){ alert('无管理员权限'); location.href='index.html'; }

async function loadStats(){
  try{
    const res = await fetch(`${API_BASE}/api/admin-stats`);
    const data = await res.json();
    document.getElementById('userCount').innerText = data.userCount;
    document.getElementById('totalGen').innerText = data.totalGenerate;
    document.getElementById('succGen').innerText = data.successNum;
    document.getElementById('failNum').innerText = data.failNum;
    document.getElementById('rate').innerText = data.successRate;
  }catch(e){}
}
loadStats();

// 手动加积分
async function addScore(){
  let username = document.getElementById('addUser').value.trim();
  let num = parseInt(document.getElementById('addNum').value);
  if(!username || !num || num<=0){
    document.getElementById('msg').innerText="请填写正确用户名和积分";
    document.getElementById('msg').className="text-red-500";
    return;
  }
  try{
    let res = await fetch(`${API_BASE}/api/admin/addscore`,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({username,num})
    });
    let d = await res.json();
    if(d.ok){
      document.getElementById('msg').innerText="添加成功！用户当前积分："+d.score;
      document.getElementById('msg').className="text-green-500";
    }else{
      document.getElementById('msg').innerText=d.msg;
      document.getElementById('msg').className="text-red-500";
    }
  }catch(e){
    document.getElementById('msg').innerText="网络错误，请稍后重试";
    document.getElementById('msg').className="text-red-500";
  }
}
</script>
</body>
</html>
