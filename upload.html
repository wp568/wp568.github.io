<!DOCTYPE html>
<html>
<head>
  <title>AI 卡通生成</title>
</head>
<body>
  <h1>上传图片生成卡通风格</h1>
  <input type="file" id="fileInput" accept="image/*">
  <br>
  <img id="preview" width="300">
  <br>
  <button onclick="generate()">生成卡通图</button>
  <br>
  <img id="result" width="300">

  <script>
    let fileBase64 = "";
    const username = localStorage.getItem("username") || "test";

    // 预览上传图片
    document.getElementById("fileInput").addEventListener("change", (e) => {
      const file = e.target.files[0];
      const reader = new FileReader();
      reader.onload = (ev) => {
        fileBase64 = ev.target.result;
        document.getElementById("preview").src = fileBase64;
      };
      reader.readAsDataURL(file);
    });

    // 调用本地接口生成
    async function generate() {
      if (!fileBase64) return alert("请先上传图片");
      const res = await fetch("/api/ai-generate", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username, image: fileBase64 })
      });
      const data = await res.json();
      if (data.ok) {
        document.getElementById("result").src = data.cartoon;
        alert(`生成成功，剩余积分：${data.score}`);
      } else {
        alert(data.msg);
      }
    }
  </script>
</body>
</html>
