<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>充值</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="p-6">
  <div class="max-w-md mx-auto bg-white p-6 rounded-xl shadow-lg">
    <h2 class="text-xl font-bold mb-4">充值（1元=1积分）</h2>
    <input id="amount" type="number" placeholder="金额" class="border p-2 w-full mb-3">
    <button id="payBtn" class="bg-green-600 text-white w-full p-2">提交充值</button>

    <!-- 返回首页 -->
    <a href="index.html" class="block text-center mt-4 text-blue-600">返回首页</a>
  </div>
  <script>
    const user = JSON.parse(localStorage.getItem("aiUser"));
    if (!user) location.href = "login.html";

    document.getElementById("payBtn").onclick = async () => {
      const amount = +document.getElementById("amount").value;
      if (!amount || amount < 1) return alert("金额错误");

      const res = await fetch("/api/recharge", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username: user.username, amount })
      });
      const data = await res.json();
      if (data.ok) {
        alert("充值提交成功，等待管理员确认到账后自动加积分");
        location.href = "index.html"; // 提交后直接回首页
      }
    };
  </script>
</body>
</html>
