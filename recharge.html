<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>积分充值</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen p-8">
<div class="max-w-md mx-auto bg-white p-8 rounded-xl shadow-lg">
  <h2 class="text-2xl font-bold text-center mb-6">积分充值</h2>
  <p class="mb-4">当前积分：<span id="myScore">0</span></p>
  <div class="grid grid-cols-3 gap-3 mb-6">
    <button class="recharge-item border p-4 rounded-lg hover:bg-green-100" data-num="10">10积分</button>
    <button class="recharge-item border p-4 rounded-lg hover:bg-green-100" data-num="50">50积分</button>
    <button class="recharge-item border p-4 rounded-lg hover:bg-green-100" data-num="100">100积分</button>
  </div>
  <a href="index.html" class="block text-center text-green-600">返回首页</a>
</div>
<script>
const API_BASE = "https://wp568-github-io.onrender.com";
let user;
try{
  user = JSON.parse(localStorage.getItem('aiUser'));
}catch(e){
  location.href='login.html';
}
if(!user) location.href='login.html';
document.getElementById('myScore').innerText = user.score;
document.querySelectorAll('.recharge-item').forEach(btn=>{
  btn.onclick = async ()=>{
    const num = btn.dataset.num;
    try{
      const res = await fetch(`${API_BASE}/api/recharge`,{
        method:'POST', headers:{'Content-Type':'application/json'},
        body:JSON.stringify({username:user.username, num})
      });
      const data = await res.json();
      alert('充值成功！');
      localStorage.setItem('aiUser',JSON.stringify({...user,score:data.score}));
      location.reload();
    }catch(e){
      alert('网络故障');
    }
  };
});
</script>
</body>
</html>
