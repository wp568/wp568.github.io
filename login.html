<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">
<div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-md">
  <h2 class="text-2xl font-bold text-center mb-6">用户登录</h2>
  <input id="username" placeholder="用户名" class="w-full border rounded-lg p-3 mb-4">
  <input id="pwd" type="password" placeholder="密码" class="w-full border rounded-lg p-3 mb-4">
  <button id="loginBtn" class="w-full bg-green-600 text-white p-3 rounded-lg">登录</button>
  <p class="text-center mt-4">没有账号？<a href="register.html" class="text-green-600">去注册</a></p>
</div>
<script>
const API_BASE = "https://ghibli-ai-api.onrender.com";
document.getElementById('loginBtn').onclick = async ()=>{
  const username = document.getElementById('username').value;
  const pwd = document.getElementById('pwd').value;
  const res = await fetch(`${API_BASE}/api/login`,{
    method:'POST', headers:{'Content-Type':'application/json'},
    body:JSON.stringify({username,pwd})
  });
  const data = await res.json();
  if(data.code!==0){ alert(data.msg); return; }
  localStorage.setItem('aiUser',JSON.stringify(data));
  location.href='index.html';
};
</script>
</body>
</html>
