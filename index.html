<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI宫崎骏多风格照片转换器</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
  <script>
    tailwind.config={theme:{extend:{colors:{ghibli:{green:'#7ba05b',blue:'#87b0d7',yellow:'#f9d76c',brown:'#9c6f47',light:'#f5f2e9'}}}}}
  </script>
</head>
<body class="bg-ghibli-light min-h-screen">
<header class="bg-white shadow-md sticky top-0 z-50">
  <div class="container mx-auto px-4 py-4 flex justify-between items-center">
    <h1 class="text-2xl font-bold text-ghibli-green"><i class="fa fa-leaf mr-2"></i>AI动漫风格转换器</h1>
    <div id="userInfo" class="flex items-center gap-3 text-sm"></div>
  </div>
</header>
<main class="container mx-auto px-4 py-10">
  <section class="max-w-4xl mx-auto bg-white rounded-2xl p-6 md:p-10 shadow-lg">
    <div class="mb-6">
      <h3 class="text-gray-700 font-medium mb-3">选择风格</h3>
      <div class="grid grid-cols-2 md:grid-cols-5 gap-3">
        <label class="border rounded-lg p-3 text-center cursor-pointer hover:bg-ghibli-light">
          <input type="radio" name="style" value="ghibli" checked> 经典宫崎骏
        </label>
        <label class="border rounded-lg p-3 text-center cursor-pointer hover:bg-ghibli-light">
          <input type="radio" name="style" value="totoro"> 龙猫
        </label>
        <label class="border rounded-lg p-3 text-center cursor-pointer hover:bg-ghibli-light">
          <input type="radio" name="style" value="spirited"> 千与千寻
        </label>
        <label class="border rounded-lg p-3 text-center cursor-pointer hover:bg-ghibli-light">
          <input type="radio" name="style" value="howl"> 哈尔的移动城堡
        </label>
        <label class="border rounded-lg p-3 text-center cursor-pointer hover:bg-ghibli-light">
          <input type="radio" name="style" value="shinkai"> 新海诚
        </label>
      </div>
    </div>
    <div id="dropArea" class="border-2 border-dashed border-ghibli-blue rounded-xl p-8 text-center cursor-pointer hover:border-ghibli-green transition mb-6">
      <input type="file" id="fileInput" accept="image/*" class="hidden">
      <i class="fa fa-cloud-upload text-5xl text-ghibli-blue mb-3"></i>
      <p class="text-gray-600 mb-2">点击上传 或 拖拽照片</p>
    </div>
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
      <div id="originalContainer" class="hidden">
        <h3 class="text-center text-gray-600 mb-2">原图</h3>
        <div class="bg-gray-100 h-72 rounded-lg flex items-center justify-center">
          <img id="originalImg" class="max-w-full max-h-full object-contain">
        </div>
      </div>
      <div id="resultContainer" class="hidden">
        <h3 class="text-center text-gray-600 mb-2">AI卡通效果</h3>
        <div class="bg-gray-100 h-72 rounded-lg flex items-center justify-center relative">
          <div id="loading" class="hidden"><i class="fa fa-spinner fa-spin text-3xl text-ghibli-green"></i><p class="mt-2">AI绘制中...</p></div>
          <canvas id="resultCanvas" class="max-w-full max-h-full object-contain hidden"></canvas>
        </div>
      </div>
    </div>
    <div class="flex justify-center gap-4">
      <button id="generateBtn" class="px-6 py-3 bg-ghibli-green text-white rounded-lg hidden">生成图片（消耗1积分）</button>
      <button id="downloadBtn" class="px-6 py-3 bg-ghibli-yellow rounded-lg hidden">下载图片</button>
    </div>
  </section>
</main>

<script>
const API_BASE = "https://wp568-github-io.onrender.com";
let loginUser = null;
let originImage = null;

const dropArea = document.getElementById('dropArea');
const fileInput = document.getElementById('fileInput');
const originalContainer = document.getElementById('originalContainer');
const resultContainer = document.getElementById('resultContainer');
const originalImg = document.getElementById('originalImg');
const resultCanvas = document.getElementById('resultCanvas');
const generateBtn = document.getElementById('generateBtn');
const downloadBtn = document.getElementById('downloadBtn');
const loading = document.getElementById('loading');
const userInfo = document.getElementById('userInfo');

function checkLogin(){
  const user = localStorage.getItem('aiUser');
  if(!user){
    userInfo.innerHTML = `<a href="login.html" class="text-ghibli-green">登录</a> <a href="register.html" class="text-ghibli-green">注册</a>`;
    return false;
  }
  try{
    loginUser = JSON.parse(user);
  }catch(e){
    localStorage.removeItem('aiUser');
    return false;
  }
  userInfo.innerHTML = `
    <span>欢迎：${loginUser.username} | 积分：${loginUser.score}</span>
    <a href="recharge.html" class="text-orange-500">充值</a>
    ${loginUser.isAdmin ? '<a href="admin.html" class="text-red-500">后台</a>' : ''}
    <button onclick="logout()" class="text-gray-500">退出</button>`;
  return true;
}
checkLogin();
function logout(){ localStorage.removeItem('aiUser'); location.href='index.html'; }

dropArea.onclick = ()=>fileInput.click();
fileInput.onchange = handleFile;
dropArea.ondragover = e=>e.preventDefault();
dropArea.ondrop = e=>{ e.preventDefault(); fileInput.files = e.dataTransfer.files; handleFile(); };

function handleFile(){
  const file = fileInput.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = e=>{
    originImage = new Image();
    originImage.src = e.target.result;
    originImage.onload = ()=>{
      originalImg.src = originImage.src;
      originalContainer.classList.remove('hidden');
      resultContainer.classList.remove('hidden');
      generateBtn.classList.remove('hidden');
      downloadBtn.classList.add('hidden');
    }
  };
  reader.readAsDataURL(file);
}

// 增强版卡通滤镜（含边缘检测+色彩量化）
function makeCartoon(style){
  const canvas = resultCanvas;
  const ctx = canvas.getContext('2d');
  const width = originImage.width;
  const height = originImage.height;
  canvas.width = width;
  canvas.height = height;

  // 第一步：绘制原图
  ctx.drawImage(originImage, 0, 0);
  let imageData = ctx.getImageData(0, 0, width, height);
  let data = imageData.data;

  // 第二步：边缘检测（Sobel算子）
  let edgeData = detectEdges(data, width, height);
  
  // 第三步：色彩量化 + 风格微调
  for(let i = 0; i < data.length; i += 4) {
    let r = data[i];
    let g = data[i+1];
    let b = data[i+2];

    // 颜色量化（减少色阶，产生色块感）
    r = Math.floor(r / 32) * 32;
    g = Math.floor(g / 32) * 32;
    b = Math.floor(b / 32) * 32;

    // 风格微调
    switch(style) {
      case 'ghibli':
        r = Math.min(255, r + 15);
        g = Math.min(255, g + 20);
        b = Math.min(255, b + 10);
        break;
      case 'totoro':
        r = Math.min(255, r + 5);
        g = Math.min(255, g + 25);
        b = Math.min(255, b + 5);
        break;
      case 'shinkai':
        r = Math.min(255, r + 25);
        g = Math.min(255, g + 25);
        b = Math.min(255, b + 30);
        break;
      case 'spirited':
        r = Math.min(255, r + 10);
        g = Math.min(255, g + 10);
        b = Math.min(255, b + 20);
        break;
      case 'howl':
        r = Math.min(255, r + 20);
        g = Math.min(255, g + 15);
        b = Math.min(255, b + 15);
        break;
    }

    // 叠加边缘线条（让轮廓更清晰）
    if(edgeData[i] === 0) {
      r = Math.max(0, r - 50);
      g = Math.max(0, g - 50);
      b = Math.max(0, b - 50);
    }

    data[i] = r;
    data[i+1] = g;
    data[i+2] = b;
  }

  ctx.putImageData(imageData, 0, 0);
  canvas.classList.remove('hidden');
}

// Sobel边缘检测函数
function detectEdges(data, width, height) {
  let output = new Uint8ClampedArray(data.length);
  const gray = new Uint8ClampedArray(width * height);
  
  // 先转灰度图
  for(let i = 0; i < data.length; i += 4) {
    gray[i/4] = 0.299 * data[i] + 0.587 * data[i+1] + 0.114 * data[i+2];
  }

  // Sobel算子
  const sobelX = [-1, 0, 1, -2, 0, 2, -1, 0, 1];
  const sobelY = [-1, -2, -1, 0, 0, 0, 1, 2, 1];

  for(let y = 1; y < height - 1; y++) {
    for(let x = 1; x < width - 1; x++) {
      let gx = 0, gy = 0;
      for(let ky = -1; ky <= 1; ky++) {
        for(let kx = -1; kx <= 1; kx++) {
          const idx = (ky + 1) * 3 + (kx + 1);
          const pixel = gray[(y + ky) * width + (x + kx)];
          gx += sobelX[idx] * pixel;
          gy += sobelY[idx] * pixel;
        }
      }
      const mag = Math.sqrt(gx * gx + gy * gy);
      output[(y * width + x) * 4] = mag > 100 ? 0 : 255;
    }
  }
  return output;
}

generateBtn.onclick = async ()=>{
  if(!checkLogin()){ alert('请先登录'); location.href='login.html'; return; }
  const style = document.querySelector('input[name="style"]:checked').value;
  loading.classList.remove('hidden');
  resultCanvas.classList.add('hidden');
  generateBtn.disabled=true;

  try{
    const res = await fetch(`${API_BASE}/api/ai-generate`,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({username:loginUser.username, image: originImage.src, style, success:true})
    });
    const data = await res.json();
    if(data.ok !== true){
      alert("积分不足或生成失败：" + (data.msg || "未知错误"));
      loading.classList.add('hidden');
      generateBtn.disabled=false;
      return;
    }
    loginUser.score = data.score;
    localStorage.setItem('aiUser',JSON.stringify(loginUser));
    checkLogin();

    // 生成卡通
    makeCartoon(style);
    downloadBtn.classList.remove('hidden');
  }catch(e){
    alert("生成失败，请稍后再试");
  }finally{
    loading.classList.add('hidden');
    generateBtn.disabled=false;
  }
};

downloadBtn.onclick = ()=>{
  const a = document.createElement('a');
  a.href = resultCanvas.toDataURL("image/png");
  a.download = '卡通风格_'+Date.now()+'.png';
  a.click();
};
</script>
</body>
</html>
