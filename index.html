<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI卡通生成</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
  <script>
    tailwind.config={theme:{extend:{colors:{ghibli:{green:'#7ba05b',blue:'#87b0d7',yellow:'#f9d76c',brown:'#9c6f47',light:'#f5f5f5'}}}}}
  </script>
</head>
<body class="bg-ghibli-light min-h-screen">
<header class="bg-white shadow-md sticky top-0 z-50">
  <div class="container mx-auto px-4 py-4 flex justify-between items-center">
    <h1 class="text-2xl font-bold text-ghibli-green"><i class="fa fa-magic mr-2"></i>AI卡通转换器</h1>
    <div id="userInfo" class="flex items-center gap-2 text-sm"></div>
  </div>
</header>

<main class="container mx-auto px-4 py-10">
  <div class="max-w-4xl mx-auto bg-white rounded-2xl p-6 shadow-lg">
    <div class="mb-6">
      <h3 class="font-medium mb-3">选择风格</h3>
      <div class="grid grid-cols-2 md:grid-cols-5 gap-2">
        <label class="border p-2 rounded text-center"><input type="radio" name="style" value="ghibli" checked> 宫崎骏</label>
        <label class="border p-2 rounded text-center"><input type="radio" name="style" value="totoro"> 龙猫</label>
        <label class="border p-2 rounded text-center"><input type="radio" name="style" value="spirited"> 千与千寻</label>
        <label class="border p-2 rounded text-center"><input type="radio" name="style" value="howl"> 哈尔</label>
        <label class="border p-2 rounded text-center"><input type="radio" name="style" value="shinkai"> 新海诚</label>
      </div>
    </div>

    <div id="uploadArea" class="border-2 border-dashed p-8 text-center mb-6 cursor-pointer">
      <input type="file" id="fileInput" accept="image/*" class="hidden">
      <i class="fa fa-cloud-upload text-4xl text-gray-400"></i>
      <p class="mt-2">点击上传图片</p>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
      <div class="bg-gray-50 p-4 rounded">
        <h3>原图</h3>
        <img id="originalImg" class="max-w-full max-h-64 mx-auto">
      </div>
      <div class="bg-gray-50 p-4 rounded">
        <h3>AI卡通图</h3>
        <img id="resultImg" class="max-w-full max-h-64 mx-auto">
        <div id="loading" class="hidden text-center mt-2"><i class="fa fa-spinner fa-spin"></i> 生成中…</div>
      </div>
    </div>

    <div class="flex justify-center gap-3">
      <button id="generateBtn" class="bg-green-600 text-white px-6 py-2 rounded hidden">生成卡通（扣1积分）</button>
      <button id="downloadBtn" class="bg-yellow-500 text-white px-6 py-2 rounded hidden">下载图片</button>
    </div>
  </div>
</main>

<script>
const API = "https://wp568-github-io.onrender.com";
let user = JSON.parse(localStorage.getItem("aiUser"));
let originalImage = null;

function checkLogin() {
  if (!user) {
    userInfo.innerHTML = `<a href="login.html" class="text-green-600">登录</a> <a href="register.html" class="text-green-600">注册</a>`;
    return false;
  }
  userInfo.innerHTML = `
    <span>欢迎：${user.username} | 积分：${user.score}</span>
    <a href="recharge.html" class="text-orange-500">充值</a>
    ${user.isAdmin ? '<a href="admin.html" class="text-red-600">后台</a>' : ''}
    <button onclick="logout()" class="text-gray-500">退出</button>
  `;
  return true;
}

function logout() {
  localStorage.removeItem("aiUser");
  location.href = "login.html";
}

checkLogin();

uploadArea.onclick = () => fileInput.click();
fileInput.onchange = (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    originalImage = ev.target.result;
    originalImg.src = originalImage;
    generateBtn.classList.remove("hidden");
  };
  reader.readAsDataURL(file);
};

generateBtn.onclick = async () => {
  if (!user) return alert("请先登录");
  if (!originalImage) return alert("请上传图片");

  generateBtn.disabled = true;
  loading.classList.remove("hidden");
  resultImg.src = "";

  try {
    const res = await fetch(API + "/api/ai-generate", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        username: user.username,
        image: originalImage,
        style: document.querySelector('input[name="style"]:checked').value
      })
    });

    const data = await res.json();
    if (data.ok) {
      resultImg.src = data.image;
      user.score = data.score;
      localStorage.setItem("aiUser", JSON.stringify(user));
      checkLogin();
      downloadBtn.classList.remove("hidden");
    } else {
      alert("生成失败：" + data.msg);
    }
  } catch (e) {
    alert("生成失败，请重试");
  } finally {
    generateBtn.disabled = false;
    loading.classList.add("hidden");
  }
};

downloadBtn.onclick = () => {
  const a = document.createElement("a");
  a.href = resultImg.src;
  a.download = "cartoon.png";
  a.click();
};
</script>
</body>
</html>
